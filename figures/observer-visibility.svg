<text x="485" y="371" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="normal" fill="#222">
<tspan x="485" dy="0">Video features + task / state conditioning</tspan>
<tspan x="485" dy="35.38">shared inputs</tspan>
</text>
